name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libshaderc-dev \
            glslang-dev \
            spirv-tools \
            vulkan-validationlayers \
            vulkan-utility-libraries-dev \
            libpng-dev \
            libwebp-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            python3-dev

      - name: Install Vulkan SDK (lavapipe ICD for headless tests)
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.noble.list \
            https://packages.lunarg.com/vulkan/1.4/lunarg-vulkan-1.4-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk mesa-vulkan-drivers

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j4

      - name: Run tests
        run: ./build/tests/volcano_tests

      - name: Python module smoke test
        if: matrix.build_type == 'Release'
        run: |
          PYTHONPATH=build/python python3 - <<'PY'
          import volcanoplot as vp
          fig = vp.Figure(320, 240)
          ax = fig.add_axes()
          ax.plot([0, 1], [0, 1])
          assert fig.savefig("/tmp/vp_smoke.png")
          PY
