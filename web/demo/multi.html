<!doctype html>
<html><body>
<canvas id="c" width="640" height="480" style="width:640px;height:480px"></canvas>
<script type="module">
import { createCanvas } from '/dist/bundle.mjs';
import VolcanoPlot from '/dist/volcanoplot.js';

// Deterministic PRNG (32-bit LCG) — the python gallery script mirrors
// this exact sequence so web and matplotlib renders share the data.
let _lcg = 12345;
const rnd = () => (_lcg = (_lcg * 1103515245 + 12345) >>> 0) / 2**32;

window.vpDone = (async () => {
    const vp = await createCanvas(document.getElementById('c'), VolcanoPlot);
    window.vp = vp;
    vp.device.addEventListener('uncapturederror',
        e => console.log('GPUERR:', e.error?.message ?? e));
    const which = new URLSearchParams(location.search).get('p') || 'bar';
    if (which === 'bar')
        vp.bar([3, 7, 2, 5], ['a', 'b', 'c', 'd'], '#2a7');
    else if (which === 'hist') {
        const s = new Float32Array(2000);
        for (let i = 0; i < s.length; i++) s[i] = Math.sin(i * 0.7) + Math.sin(i * 1.3) * 0.5;
        vp.hist(s, 20, '#e00000');
    } else if (which === 'pie')
        vp.pie([40, 30, 20, 10], ['w', 'x', 'y', 'z']);
    else if (which === 'heat') {
        const g = new Float32Array(64 * 48);
        for (let i = 0; i < g.length; i++) {
            const x = i % 64, y = (i / 64) | 0;
            g[i] = Math.sin(x * 0.2) * Math.cos(y * 0.15);
        }
        vp.heatmap(g, 64, 48, 'viridis');
    } else if (which === 'pcm') {
        const nx = 33, ny = 25;
        const xs = new Float32Array(nx), ys = new Float32Array(ny),
              cs = new Float32Array((nx - 1) * (ny - 1));
        for (let i = 0; i < nx; i++) xs[i] = i / (nx - 1);
        for (let j = 0; j < ny; j++) ys[j] = j / (ny - 1);
        for (let j = 0; j < ny - 1; j++)
            for (let i = 0; i < nx - 1; i++)
                cs[j * (nx - 1) + i] =
                    Math.sin(i * 0.4) * Math.cos(j * 0.35);
        vp.pcolormesh(xs, ys, cs, nx - 1, ny - 1);
    } else if (which === 'surface') {
        const W = 40, H = 30, g = new Float32Array(W * H);
        for (let j = 0; j < H; j++)
            for (let i = 0; i < W; i++) {
                const x = i * 0.3 - 6, y = j * 0.3 - 4.5;
                g[j * W + i] = Math.sin(Math.sqrt(x * x + y * y));
            }
        vp.surface(g, W, H);
    } else if (which === 'contour') {
        const W = 50, H = 40, g = new Float32Array(W * H);
        for (let j = 0; j < H; j++)
            for (let i = 0; i < W; i++) {
                const x = i * 0.2 - 5, y = j * 0.2 - 4;
                g[j * W + i] = Math.sin(Math.sqrt(x * x + y * y));
            }
        vp.contour(g, W, H, 8);
    } else if (which === 'hist2d' || which === 'kde') {
        const n = 4000, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            xs[i] = Math.sin(i * 0.61) + Math.sin(i * 1.13) * 0.4;
            ys[i] = Math.cos(i * 0.37) + Math.cos(i * 0.83) * 0.4;
        }
        if (which === 'hist2d') vp.hist2d(xs, ys, 24);
        else vp.kde(xs, ys);
    } else if (which === 'dashed') {
        const n = 400, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            xs[i] = i / n * 10;
            ys[i] = Math.sin(xs[i] * 1.7) * (1 + 0.3 * Math.cos(xs[i]));
        }
        vp.line(xs, ys, '#c02020', 2, '--');
    } else if (which === 'hexbin') {
        const n = 4000, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            xs[i] = Math.sin(i * 0.61) + Math.sin(i * 1.13) * 0.4;
            ys[i] = Math.cos(i * 0.37) + Math.cos(i * 0.83) * 0.4;
        }
        vp.hexbin(xs, ys);
    } else if (which === 'box') {
        vp.boxplot([[1, 2, 3, 4, 5, 2.5], [2, 4, 6, 8, 3],
                    [0.5, 1, 1.5, 2, 9]]);
    } else if (which === 'stem') {
        const n = 40, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) { xs[i] = i; ys[i] = Math.sin(i * 0.4); }
        vp.stem(xs, ys);
    } else if (which === 'quiver') {
        const n = 100, xs = new Float32Array(n), ys = new Float32Array(n),
              us = new Float32Array(n), vs = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const x = (i % 10) / 9, y = ((i / 10) | 0) / 9;
            xs[i] = x; ys[i] = y;
            us[i] = -Math.sin(y * 6.28); vs[i] = Math.cos(x * 6.28);
        }
        vp.quiver(xs, ys, us, vs);
    } else if (which === 'subplot') {
        // 2×1 grid: sine on top, cosine below — different curves,
        // different colors, in different rect regions.
        vp.subplot(2, 1, 1);
        const N = 256, xs = new Float32Array(N), ys = new Float32Array(N);
        for (let i = 0; i < N; i++) { xs[i] = i/(N-1); ys[i] = Math.sin(i*0.08); }
        vp.line(xs, ys, '#e00000');
        vp.subplot(2, 1, 2);
        for (let i = 0; i < N; i++) ys[i] = Math.cos(i*0.08);
        vp.line(xs, ys, '#0060e0');
    } else if (which === 'violin') {
        const g = [];
        for (let k = 0; k < 3; k++) {
            const n = 2000, v = new Float32Array(n);   // ≥200k evals → GPU KDE
            for (let i = 0; i < n; i++)
                v[i] = 3 + k * 2 + Math.sin(i * 0.7 + k) * Math.exp(-((i - n / 2) ** 2) / 4000);
            g.push(v);
        }
        vp.violin(g, 0.5, true, '#209040');
    } else if (which === 'stackplot') {
        const N = 40, xs = new Float32Array(N);
        const l1 = new Float32Array(N), l2 = new Float32Array(N),
              l3 = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            xs[i] = i; l1[i] = 2 + Math.sin(i * 0.3);
            l2[i] = 1.5 + Math.cos(i * 0.2); l3[i] = 1 + Math.sin(i * 0.5);
        }
        vp.stackplot(xs, [l1, l2, l3]);
    } else if (which === 'fill') {
        const N = 50, xs = new Float32Array(N), ys = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            const t = i / (N - 1) * 6.28;
            xs[i] = Math.cos(t) * (1 + 0.3 * Math.sin(3 * t));
            ys[i] = Math.sin(t) * (1 + 0.3 * Math.sin(3 * t));
        }
        vp.fill(xs, ys, '#e00000');
    } else if (which === 'scatter') {
        // Dense cloud — overdraw matters, which is exactly the case
        // density splatting targets.
        const N = 6000, xs = new Float32Array(N), ys = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            const a = rnd() * 6.28318, r = Math.sqrt(rnd());
            xs[i] = Math.cos(a) * r * 1.5 + (rnd() - 0.5) * 0.3;
            ys[i] = Math.sin(a) * r * 1.5 + (rnd() - 0.5) * 0.3;
        }
        vp.scatter(xs, ys);
    } else if (which === 'fillbetween') {
        // Two crossing curves so the interpolated run boundaries (the
        // f1 == f2 crossings) are exercised.
        const N = 120, xs = new Float32Array(N),
              lo = new Float32Array(N), hi = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            const t = i / (N - 1) * 4 * Math.PI;
            xs[i] = t;
            lo[i] = Math.sin(t) * 1.2;
            hi[i] = Math.cos(t * 0.7) * 0.9 + 0.2;
        }
        vp.fillBetween(xs, lo, hi, '#3b7dd8');
    } else if (which === 'spy') {
        const n = 32, d = new Float32Array(n * n);
        for (let i = 0; i < n; i++) { d[i * n + i] = 1;
            if (i + 4 < n) d[i * n + i + 4] = 1;
            if (i % 7 === 0) d[i * n + (n - 1 - i)] = 1; }
        vp.spy(d, n, n);
    } else if (which === 'tripcolor') {
        const N = 60, xs = new Float32Array(N), ys = new Float32Array(N),
              zs = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            const a = i * 0.7, r = 0.3 + 0.65 * (i % 8) / 8;
            xs[i] = Math.cos(a) * r; ys[i] = Math.sin(a) * r;
            zs[i] = Math.sin(xs[i] * 9) + Math.cos(ys[i] * 9);
        }
        vp.tripcolor(xs, ys, zs);
    } else if (which === 'streamplot') {
        const n = 24, u = new Float32Array(n * n), v = new Float32Array(n * n);
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
            const x = i / n * 6.28, y = j / n * 6.28;
            u[j * n + i] = Math.sin(y); v[j * n + i] = Math.cos(x);
        }
        vp.streamplot(u, v, n, n);
    } else if (which === 'matshow') {
        const n = 24, d = new Float32Array(n * n);
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++)
            d[j * n + i] = Math.sin(i * 0.5) * Math.cos(j * 0.4);
        vp.matshow(d, n, n);
    } else if (which === 'pcolorfast') {
        const n = 24, c = new Float32Array(n * n);
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++)
            c[j * n + i] = Math.sin(i * 0.5) * Math.cos(j * 0.4);
        vp.pcolorfast(c, n, n);
    } else if (which === 'brokenbarh') {
        vp.brokenBarh([10, 40, 15, 10,   180, 30, 15, 10,
                       50, 110, 5, 10,   122, 25, 5, 10]);
    } else if (which === 'tricontour' || which === 'tricontourf' ||
               which === 'triplot' || which === 'trisurf') {
        const N = 80, xs = new Float32Array(N), ys = new Float32Array(N),
              zs = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            const a = i * 0.7, r = 0.2 + 0.75 * (i % 9) / 9;
            xs[i] = Math.cos(a) * r; ys[i] = Math.sin(a) * r;
            zs[i] = Math.sin(xs[i] * 8) + Math.cos(ys[i] * 8);
        }
        if (which === 'tricontour') vp.tricontour(xs, ys, zs);
        else if (which === 'tricontourf') vp.tricontourf(xs, ys, zs);
        else if (which === 'triplot') vp.triplot(xs, ys);
        else vp.trisurf(xs, ys, zs);
    } else if (which === 'specgram' || which === 'spectrum' ||
               which === 'psd' || which === 'csd' || which === 'xcorr' ||
               which === 'cohere') {
        const n = 2048, s = new Float32Array(n), s2 = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            s[i] = Math.sin(i * 0.3) + Math.sin(i * 1.1) * 0.4 +
                   (rnd() - 0.5) * 0.3;
            s2[i] = Math.sin(i * 0.3 + 0.5) + (rnd() - 0.5) * 0.3;
        }
        if (which === 'specgram') vp.specgram(s, 100);
        else if (which === 'spectrum') vp.spectrum(s, 100);
        else if (which === 'psd') vp.psd(s, 100);
        else if (which === 'csd') vp.csd(s, s2, 100);
        else if (which === 'xcorr') vp.xcorr(s, s2);
        else vp.cohere(s, s2, 100);
    } else if (which === 'wireframe') {
        const W = 30, H = 24, g = new Float32Array(W * H);
        for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
            const x = i * 0.4 - 6, y = j * 0.4 - 4.8;
            g[j * W + i] = Math.sin(Math.sqrt(x * x + y * y));
        }
        vp.wireframe(g, W, H);
    } else if (which === 'annotate') {
        const n = 64, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) { xs[i] = i/(n-1); ys[i] = Math.sin(i*0.15); }
        vp.line(xs, ys, '#e00000');
        vp.axhline(0, '#0060e0', 1.5);
        vp.axvline(0.5, '#00a040', 1.5);
        vp.axhspan(0.6, 0.9, '#00e0e040');
        vp.hlines([0.3, -0.5], 0, 1, '#8040c0', 1);
        vp.title('Annotated'); vp.xlabel('x'); vp.ylabel('y');
        vp.text(0.5, 0.9, 'peak zone', 'axes');
        vp.legend('upper right'); vp.colorbar();
    } else if (which === 'plot3d') {
        const n = 200, xs = new Float32Array(n), ys = new Float32Array(n),
              zs = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const t = i / n * 12.56;
            xs[i] = Math.cos(t); ys[i] = Math.sin(t); zs[i] = t / 12.56;
        }
        vp.plot3d(xs, ys, zs);
    } else if (which === 'navcube') {
        const n = 200, xs = new Float32Array(n), ys = new Float32Array(n),
              zs = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const t = i / n * 12.56;
            xs[i] = Math.cos(t); ys[i] = Math.sin(t); zs[i] = t / 12.56;
        }
        vp.plot3d(xs, ys, zs);
        vp.navcube(30, -60, 'ur', 'cube');
    } else if (which === 'quiverkey') {
        const xs = [], ys = [], us = [], vs = [];
        for (let ix = 0; ix < 8; ix++)
            for (let iy = 0; iy < 8; iy++) {
                const x = ix - 3.5, y = iy - 3.5;
                xs.push(x); ys.push(y); us.push(-y); vs.push(x);
            }
        const qh = vp.quiver(xs, ys, us, vs);
        vp.quiverkey(0.9, 0.95, 4, qh, '4 u');
    } else if (which === 'scatter3d' || which === 'quiver3d' ||
               which === 'errorbar3d' || which === 'tricontour3d' ||
               which === 'tricontourf3d') {
        const n = 60, xs = new Float32Array(n), ys = new Float32Array(n),
              zs = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const a = i * 0.7, r = 0.3 + 0.65 * (i % 8) / 8;
            xs[i] = Math.cos(a) * r; ys[i] = Math.sin(a) * r;
            zs[i] = (i % 10) / 10;
        }
        if (which === 'scatter3d') vp.scatter3d(xs, ys, zs);
        else if (which === 'tricontour3d') vp.tricontour3d(xs, ys, zs);
        else if (which === 'tricontourf3d') vp.tricontourf3d(xs, ys, zs);
        else if (which === 'quiver3d') {
            const us = new Float32Array(n), vs = new Float32Array(n),
                  ws = new Float32Array(n);
            for (let i = 0; i < n; i++) {
                us[i] = -ys[i]; vs[i] = xs[i]; ws[i] = 0.2;
            }
            vp.quiver3d(xs, ys, zs, us, vs, ws);
        } else {
            const e = new Float32Array(n).fill(0.15);
            vp.errorbar3d(xs, ys, zs, e);
        }
    } else if (which === 'bar3d') {
        const n = 36, xs = new Float32Array(n), ys = new Float32Array(n),
              zs = new Float32Array(n), dx = new Float32Array(n),
              dy = new Float32Array(n), dz = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            xs[i] = (i % 6) * 0.25; ys[i] = ((i / 6) | 0) * 0.25;
            zs[i] = 0; dx[i] = dy[i] = 0.15;
            dz[i] = 0.3 + Math.abs(Math.sin(i * 0.9)) * 0.7;
        }
        vp.bar3d(xs, ys, zs, dx, dy, dz);
    } else if (which === 'contour3d' || which === 'contourf3d') {
        const W = 30, H = 24, g = new Float32Array(W * H);
        for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
            const x = i * 0.4 - 6, y = j * 0.4 - 4.8;
            g[j * W + i] = Math.sin(Math.sqrt(x * x + y * y));
        }
        vp.contour3d(g, W, H, which === 'contourf3d');
    } else if (which === 'voxels') {
        const n = 8, f = new Uint8Array(n * n * n);
        for (let z = 0; z < n; z++) for (let y = 0; y < n; y++)
            for (let x = 0; x < n; x++) {
                const dx = x - 3.5, dy = y - 3.5, dz = z - 3.5;
                f[z * n * n + y * n + x] =
                    dx * dx + dy * dy + dz * dz < 12 ? 1 : 0;
            }
        vp.voxels(f, n, n, n);
    } else if (which === 'text3d') {
        vp.plot3d([0, 1], [0, 1], [0, 1]);
        vp.text3d(0.5, 0.5, 0.9, 'peak');
    } else if (which === 'barbs') {
        const n = 10, xs = new Float32Array(n * n),
              ys = new Float32Array(n * n), us = new Float32Array(n * n),
              vs = new Float32Array(n * n);
        for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
            xs[j * n + i] = i; ys[j * n + i] = j;
            us[j * n + i] = Math.cos(i * 0.6) * 20;
            vs[j * n + i] = Math.sin(j * 0.6) * 20;
        }
        vp.barbs(xs, ys, us, vs);
    } else if (which === 'groupedbar') {
        vp.groupedBar([[3, 7, 2, 5], [4, 2, 6, 3], [2, 5, 3, 6]]);
    } else if (which === 'figimage') {
        const w = 80, h = 60, px = new Uint32Array(w * h);
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
            px[j * w + i] = 0xff000000 |
                ((i * 4) << 16) | ((j * 4) << 8) | 0x80;
        vp.figimage(px, w, h);
    } else if (which === 'chirp') {
        vp.chirp(1, 20, 1, 1);
    } else if (which === 'mexicanhat') {
        vp.mexicanHat(1.5, 8);
    } else if (which === 'barlabel') {
        const xs = [0, 1, 2, 3], hs = [3, 7, 2, 5];
        vp.bar(hs, ['a', 'b', 'c', 'd'], '#2a7');
        vp.barLabel(xs, hs);
    }
    const px = await vp.capture();
    window.vpPixels = px;
    return 'rendered ' + which;
})();
window.vpDone.then(v => { window.vpResult = v; },
                   e => { window.vpError = String(e.stack || e); });
</script>
</body></html>
