<!doctype html>
<html><body>
<canvas id="c" width="640" height="480" style="width:640px;height:480px"></canvas>
<script type="module">
import { createCanvas } from '/dist/bundle.mjs';
import VolcanoPlot from '/dist/volcanoplot.js';

window.vpDone = (async () => {
    const vp = await createCanvas(document.getElementById('c'), VolcanoPlot);
    window.vp = vp;
    vp.device.addEventListener('uncapturederror',
        e => console.log('GPUERR:', e.error?.message ?? e));
    const which = new URLSearchParams(location.search).get('p') || 'bar';
    if (which === 'bar')
        vp.bar([3, 7, 2, 5], ['a', 'b', 'c', 'd'], '#2a7');
    else if (which === 'hist') {
        const s = new Float32Array(2000);
        for (let i = 0; i < s.length; i++) s[i] = Math.sin(i * 0.7) + Math.sin(i * 1.3) * 0.5;
        vp.hist(s, 20, '#e00000');
    } else if (which === 'pie')
        vp.pie([40, 30, 20, 10], ['w', 'x', 'y', 'z']);
    else if (which === 'heat') {
        const g = new Float32Array(64 * 48);
        for (let i = 0; i < g.length; i++) {
            const x = i % 64, y = (i / 64) | 0;
            g[i] = Math.sin(x * 0.2) * Math.cos(y * 0.15);
        }
        vp.heatmap(g, 64, 48, 'viridis');
    } else if (which === 'pcm') {
        const nx = 33, ny = 25;
        const xs = new Float32Array(nx), ys = new Float32Array(ny),
              cs = new Float32Array((nx - 1) * (ny - 1));
        for (let i = 0; i < nx; i++) xs[i] = i / (nx - 1);
        for (let j = 0; j < ny; j++) ys[j] = j / (ny - 1);
        for (let j = 0; j < ny - 1; j++)
            for (let i = 0; i < nx - 1; i++)
                cs[j * (nx - 1) + i] =
                    Math.sin(i * 0.4) * Math.cos(j * 0.35);
        vp.pcolormesh(xs, ys, cs, nx - 1, ny - 1);
    } else if (which === 'surface') {
        const W = 40, H = 30, g = new Float32Array(W * H);
        for (let j = 0; j < H; j++)
            for (let i = 0; i < W; i++) {
                const x = i * 0.3 - 6, y = j * 0.3 - 4.5;
                g[j * W + i] = Math.sin(Math.sqrt(x * x + y * y));
            }
        vp.surface(g, W, H);
    } else if (which === 'contour') {
        const W = 50, H = 40, g = new Float32Array(W * H);
        for (let j = 0; j < H; j++)
            for (let i = 0; i < W; i++) {
                const x = i * 0.2 - 5, y = j * 0.2 - 4;
                g[j * W + i] = Math.sin(Math.sqrt(x * x + y * y));
            }
        vp.contour(g, W, H, 8);
    } else if (which === 'hist2d' || which === 'kde') {
        const n = 4000, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            xs[i] = Math.sin(i * 0.61) + Math.sin(i * 1.13) * 0.4;
            ys[i] = Math.cos(i * 0.37) + Math.cos(i * 0.83) * 0.4;
        }
        if (which === 'hist2d') vp.hist2d(xs, ys, 24);
        else vp.kde(xs, ys);
    } else if (which === 'box') {
        vp.boxplot([[1, 2, 3, 4, 5, 2.5], [2, 4, 6, 8, 3],
                    [0.5, 1, 1.5, 2, 9]]);
    } else if (which === 'stem') {
        const n = 40, xs = new Float32Array(n), ys = new Float32Array(n);
        for (let i = 0; i < n; i++) { xs[i] = i; ys[i] = Math.sin(i * 0.4); }
        vp.stem(xs, ys);
    } else if (which === 'quiver') {
        const n = 100, xs = new Float32Array(n), ys = new Float32Array(n),
              us = new Float32Array(n), vs = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const x = (i % 10) / 9, y = ((i / 10) | 0) / 9;
            xs[i] = x; ys[i] = y;
            us[i] = -Math.sin(y * 6.28); vs[i] = Math.cos(x * 6.28);
        }
        vp.quiver(xs, ys, us, vs);
    } else if (which === 'subplot') {
        // 2×1 grid: sine on top, cosine below — different curves,
        // different colors, in different rect regions.
        vp.subplot(2, 1, 1);
        const N = 256, xs = new Float32Array(N), ys = new Float32Array(N);
        for (let i = 0; i < N; i++) { xs[i] = i/(N-1); ys[i] = Math.sin(i*0.08); }
        vp.line(xs, ys, '#e00000');
        vp.subplot(2, 1, 2);
        for (let i = 0; i < N; i++) ys[i] = Math.cos(i*0.08);
        vp.line(xs, ys, '#0060e0');
    }
    const px = await vp.capture();
    window.vpPixels = px;
    return 'rendered ' + which;
})();
window.vpDone.then(v => { window.vpResult = v; },
                   e => { window.vpError = String(e.stack || e); });
</script>
</body></html>
