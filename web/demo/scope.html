<!doctype html>
<html><body style="margin:0;background:#111">
<canvas id="c" style="width:100vw;height:100vh"></canvas>
<script type="module">
import { createCanvas } from '/dist/bundle.mjs';
import VolcanoPlot from '/dist/volcanoplot.js';

// 1 kHz-style oscilloscope: a rolling window of N samples updated every
// rAF via the in-place setData fast path.
window.vpDone = (async () => {
    const vp = await createCanvas(document.getElementById('c'), VolcanoPlot);
    window.vp = vp;
    const N = 1024;
    const xs = new Float32Array(N), ys = new Float32Array(N);
    for (let i = 0; i < N; i++) xs[i] = i;
    const h = vp.line(xs, ys, '#00ff88');
    let t = 0, frames = 0;
    window.vpStats = { frames: 0 };
    const tick = () => {
        for (let i = 0; i < N; i++) {
            const tt = t + i * 0.002;
            ys[i] = Math.sin(2 * Math.PI * tt * 5) *
                    Math.exp(-((tt % 0.4)) * 8);
        }
        t += 1 / 60;
        vp.setData(h, xs, ys);
        vp.renderIfStale();
        window.vpStats.frames = ++frames;
        requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    return 'running';
})();
window.vpDone.then(v => { window.vpResult = v; },
                   e => { window.vpError = String(e.stack || e); });
</script>
</body></html>
